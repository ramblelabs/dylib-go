name: Go
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Go native / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.target == 'darwin-amd64' && 90 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-amd64, arch: x64, languages: 'rust,zig,fortran,go'}
          - {os: ubuntu-24.04-arm, target: linux-arm64, arch: arm64, languages: 'rust,zig,fortran,go'}
          - {os: macos-15-intel, target: darwin-amd64, arch: x64, languages: 'rust,zig,fortran,swift,objc,go'}
          - {os: macos-15, target: darwin-arm64, arch: arm64, languages: 'rust,zig,fortran,swift,objc,go'}
          - {os: windows-2022, target: windows-amd64, arch: x64, languages: 'go'}
          - {os: ubuntu-24.04, target: linux-386, arch: '386', languages: 'go'}
          - {os: windows-2022, target: windows-386, arch: '386', languages: 'go'}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      DYLIB_TEST_REQUIRE_NATIVE: '1'
      DYLIB_TEST_REQUIRE_SHARED: '1'
      DYLIB_TEST_REQUIRE_TOOLS: '1'
      DYLIB_TEST_REQUIRE_LLVM: '1'
      DYLIB_TEST_LANGUAGES: ${{ matrix.languages }}
      GO_TEST_TIMEOUT: ${{ matrix.target == 'darwin-amd64' && '30m' || '20m' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          architecture: ${{ matrix.arch }}
          cache: false
      - if: runner.os != 'Windows'
        run: bash scripts/ci-unix-deps.sh
      - name: Install native Linux i386 dependencies
        if: matrix.target == 'linux-386'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y g++-multilib libffi-dev:i386
          echo 'CC=clang -m32' >> "$GITHUB_ENV"
          echo 'PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig' >> "$GITHUB_ENV"
      - if: runner.os != 'Windows' && matrix.arch != '386'
        uses: dtolnay/rust-toolchain@stable
      - if: runner.os != 'Windows' && matrix.arch != '386'
        uses: mlugg/setup-zig@v2
        with:
          version: '0.15.2'
      - if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-llvm mingw-w64-clang-x86_64-binutils mingw-w64-clang-x86_64-libffi mingw-w64-clang-x86_64-pkgconf ${{ matrix.arch == '386' && 'mingw-w64-i686-gcc mingw-w64-i686-libffi mingw-w64-i686-pkgconf' || '' }}
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          Add-Content $env:GITHUB_PATH (Join-Path $env:MSYS2_ROOT 'clang64/bin')
          Add-Content $env:GITHUB_ENV 'CC=clang'
      - name: Select native Windows i386 toolchain
        if: matrix.target == 'windows-386'
        shell: bash
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          # Clang runs as a 64-bit tool and targets native i386 GNU libraries.
          # Raw object fixtures explicitly select the i686 MSVC target.
          mingw32_root=$(cygpath -u "$MSYS2_ROOT")/mingw32
          echo "DYLIB_NATIVE_SYSROOT=$(cygpath -m "$mingw32_root")" >> "$GITHUB_ENV"
          echo "$(cygpath -w "$mingw32_root/bin")" >> "$GITHUB_PATH"
          echo 'CC=gcc' >> "$GITHUB_ENV"
      - name: Toolchain identity
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED CC
          clang --version
          pkg-config --modversion libffi
      - name: Execute C/C++, archives, shared libraries and selected language interfaces
        run: |
          if [[ '${{ matrix.target }}' == darwin-amd64 ]]; then
            bash scripts/test-native.sh go
          else
            go test -count=1 -timeout="$GO_TEST_TIMEOUT" -v -tags libffi ./...
          fi
      - name: Execute README cgo, dynamic call and callback examples
        run: bash examples/run.sh go library
      - name: Execute dynamic CLI signatures, values, objects and libraries
        run: |
          bash scripts/verify-cli.sh go
          bash examples/run.sh go structs
      - name: Execute README object/archive quick start
        if: runner.os != 'Windows'
        run: |
          bash examples/run.sh go quickstart
          bash examples/run.sh go dynamic
      - name: Race and lifetime checks
        if: matrix.arch != '386'
        env:
          DYLIB_TEST_LANGUAGES: ''
        run: |
          if [[ '${{ matrix.target }}' == darwin-amd64 ]]; then
            bash scripts/test-native.sh go -race
          else
            go test -count=1 -timeout="$GO_TEST_TIMEOUT" -race -tags libffi ./...
          fi
      - run: go vet -tags libffi ./...

  inspection:
    name: Go pure / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-amd64, arch: x64}
          - {os: ubuntu-24.04-arm, target: linux-arm64, arch: arm64}
          - {os: ubuntu-24.04, target: linux-386, arch: '386'}
          - {os: macos-15-intel, target: darwin-amd64, arch: x64}
          - {os: macos-15, target: darwin-arm64, arch: arm64}
          - {os: windows-2022, target: windows-amd64, arch: x64}
          - {os: windows-11-arm, target: windows-arm64, arch: arm64}
          - {os: windows-2022, target: windows-386, arch: '386'}
    env:
      CGO_ENABLED: '0'
      DYLIB_TEST_REQUIRE_TOOLS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          architecture: ${{ matrix.arch }}
          cache: false
      - name: Run parser and unsupported-target tests in the target process
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED
          go test -count=1 -v ./...
          go build ./cmd/ddlgo
