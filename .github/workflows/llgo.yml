name: llgo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: llgo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: llgo / ${{ matrix.target }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.target == 'darwin-amd64' && 120 || 75 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-amd64, arch: amd64, mode: native, languages: 'rust,zig,fortran,go,llgo'}
          - {os: ubuntu-24.04-arm, target: linux-arm64, arch: arm64, mode: native, languages: 'rust,zig,fortran,go,llgo'}
          - {os: macos-15-intel, target: darwin-amd64, arch: amd64, mode: native, languages: 'rust,zig,fortran,swift,objc,go,llgo'}
          - {os: macos-15, target: darwin-arm64, arch: arm64, mode: native, languages: 'rust,zig,fortran,swift,objc,go,llgo'}
          - {os: windows-2022, target: windows-amd64, arch: amd64, mode: native, languages: 'go,llgo'}
          - {os: windows-11-arm, target: windows-arm64, arch: arm64, mode: native, languages: 'go,llgo'}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      LLGO_TEST_TIMEOUT: '35m'
      DYLIB_TEST_REQUIRE_NATIVE: ${{ matrix.mode == 'native' && '1' || '0' }}
      DYLIB_TEST_REQUIRE_SHARED: '1'
      DYLIB_TEST_REQUIRE_TOOLS: '1'
      DYLIB_TEST_REQUIRE_LLVM: '1'
      DYLIB_TEST_LANGUAGES: ${{ matrix.languages }}
    steps:
      - uses: actions/checkout@v7
      - uses: xgo-dev/setup-llgo@v0.2.0
        id: llgo
        with:
          # Includes the merged imported bound-method identity fix (#2851).
          llgo-version: 5926054cd0ae0e5a621557288e79d2c28bdb5fa2
          install-method: source
          go-version: '1.27.x'
          llvm-version: '22'
          architecture: ${{ matrix.arch }}
          windows-abi: mingw
          cache-dependency-path: go.mod
      - if: runner.os != 'Windows'
        run: bash scripts/ci-unix-deps.sh
      - name: Install macOS ARM64 linkers
        if: matrix.target == 'darwin-arm64'
        run: |
          brew update
          brew install --skip-link lld@22 lld@23
          "$(brew --prefix lld@22)/bin/ld64.lld" --version
          "$(brew --prefix lld@23)/bin/ld64.lld" --version
      - if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@stable
      - if: runner.os != 'Windows'
        uses: mlugg/setup-zig@v2
        with:
          version: '0.15.2'
      - name: Toolchain identity
        env:
          LLGO_REVISION: ${{ steps.llgo.outputs.llgo-revision }}
        run: |
          llgo version
          go version
          go env GOOS GOARCH CGO_ENABLED CC
          clang --version
          echo "LLGo revision: $LLGO_REVISION" >> "$GITHUB_STEP_SUMMARY"
      - name: Execute independent Go host on Windows ARM64
        if: matrix.target == 'windows-arm64'
        # setup-llgo uses setup-go and provides the native ARM64 C toolchain.
        # Build a separate gc test executable, including Go/llgo DLL producers.
        run: |
          go test -count=1 -v ./abi ./compiler/cbridge
          go test -count=1 -timeout=20m -v -tags libffi ./...
      - name: Execute direct llgo function-pointer path
        # Run the compiler qualification matrix once, in the libffi suite below.
        # Keep its backend-unavailable cases here as well as all direct callers.
        run: |
          bash scripts/test-packages.sh llgo llgo "$LLGO_TEST_TIMEOUT"
          llgo test -count=1 -timeout="$LLGO_TEST_TIMEOUT" -v \
            -run '^(TestRecordsAcrossTargets|TestCallbackRecordFieldsAcrossTargets|TestRecordMetadataValidationAndBudgets)$' ./compiler/clang
      - name: Execute optional scalar, struct and callback libffi ABI
        env:
          # Rust alternate-ABI calls and Swift/ObjC facade ownership need libffi.
          DYLIB_TEST_LANGUAGES: ${{ runner.os == 'macOS' && 'rust,swift,objc' || runner.os == 'Linux' && 'rust' || '' }}
        run: |
          if [[ '${{ runner.os }}' == macOS ]]; then
            bash scripts/test-native.sh llgo
          else
            llgo test -count=1 -timeout="$LLGO_TEST_TIMEOUT" -v -tags libffi ./...
          fi
      - name: Build CLI with llgo
        run: llgo build -o ddlgo ./cmd/ddlgo
      - name: Execute README llgo, dynamic call and callback examples
        run: bash examples/run.sh llgo library
      - name: Execute dynamic CLI signatures, values, objects and libraries
        run: |
          bash scripts/verify-cli.sh llgo
          bash examples/run.sh llgo structs
      - name: Execute README object/archive quick start with llgo
        if: runner.os != 'Windows'
        run: |
          bash examples/run.sh llgo quickstart
          bash examples/run.sh llgo dynamic
      - name: Execute README Go examples on Windows ARM64
        if: matrix.target == 'windows-arm64'
        run: |
          bash examples/run.sh go library
          bash scripts/verify-cli.sh go
          bash examples/run.sh go structs
      - name: Record setup-llgo 386 boundary
        if: matrix.target == 'linux-amd64'
        run: echo 'setup-llgo v0.2.0 installs amd64/arm64 only; 386 runtime is not claimed by this workflow.' >> "$GITHUB_STEP_SUMMARY"
